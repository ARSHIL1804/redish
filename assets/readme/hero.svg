<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Redish, a compact Redis-compatible Go server</title>
  <desc id="desc">A terminal-inspired architecture panel showing RESP commands flowing through an event loop into a store with LFU eviction and AOF persistence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="1" stop-color="#17252a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16252b"/>
      <stop offset="1" stop-color="#1d3031"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7e4c7" stroke-opacity=".06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061014" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 292H1200" stroke="#b7e4c7" stroke-opacity=".13"/>
  <circle cx="1110" cy="54" r="92" fill="#f2cc8f" fill-opacity=".08"/>
  <g id="title-block" transform="translate(58 48)">
    <text fill="#f2cc8f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2">IN-MEMORY TCP SERVER / GO</text>
    <text y="62" fill="#f5f1e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="54" font-weight="800">redish</text>
    <text y="98" fill="#b7e4c7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22">A compact Redis-compatible server</text>
    <text y="132" fill="#a8b9b5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">RESP pipelines · volatile LFU/LRU · AOF durability</text>
  </g>
  <g id="proof-board" transform="translate(58 214)" filter="url(#shadow)">
    <rect width="1084" height="96" rx="14" fill="url(#panel)" stroke="#b7e4c7" stroke-opacity=".22"/>
    <circle cx="24" cy="22" r="5" fill="#e07a5f"/>
    <circle cx="43" cy="22" r="5" fill="#f2cc8f"/>
    <circle cx="62" cy="22" r="5" fill="#b7e4c7"/>
    <text x="28" y="56" fill="#f2f1ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">$ printf '*2\\r\\n$4\\r\\nGET\\r\\n$1\\r\\na\\r\\n' | nc 127.0.0.1 7379</text>
    <text x="28" y="80" fill="#b7e4c7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">&gt; event loop  →  command eval  →  store  →  +OK / value</text>
    <g transform="translate(790 32)">
      <rect width="92" height="32" rx="8" fill="#b7e4c7" fill-opacity=".13" stroke="#b7e4c7" stroke-opacity=".35"/>
      <text x="46" y="21" text-anchor="middle" fill="#b7e4c7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">EPOLL</text>
      <path d="M104 16H132" stroke="#f2cc8f" stroke-width="2"/>
      <path d="m128 11 8 5-8 5" fill="none" stroke="#f2cc8f" stroke-width="2"/>
      <rect x="148" width="92" height="32" rx="8" fill="#f2cc8f" fill-opacity=".13" stroke="#f2cc8f" stroke-opacity=".35"/>
      <text x="194" y="21" text-anchor="middle" fill="#f2cc8f" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">AOF</text>
    </g>
  </g>
  <text x="58" y="340" fill="#778d8a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">PERSISTENCE • EXPIRATION • APPROXIMATE EVICTION</text>
  <text x="1142" y="340" text-anchor="end" fill="#778d8a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">RESP/2</text>
</svg>
